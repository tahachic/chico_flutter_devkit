openapi: 3.0.3
info:
  title: API Key API
  version: 1.0.0
servers:
  - url: https://key.example.com
paths:
  /ping:
    get:
      operationId: ping
      responses:
        '200':
          description: OK
components:
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
security:
  - apiKeyAuth: []
